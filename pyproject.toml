[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "narrashap"
version = "0.1.0"
description = "Transform SHAP explanations into fidelity-checked natural-language narratives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "shap",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest", "anthropic", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["."]
include = ["narrashap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
